name: ghel-model-status on gh-ci with gradle

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # don't like this, leave as a safeguard
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4 # add bot

      - name: Set up JDK 17
        uses: actions/setup-java@v4 # add bot
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Run tests
        run: ./gradlew test

      - name: Package with Maven
        run: ./gradlew pTML #assemble
