name: ghel-model-status on gh-ci with gradle

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # don't like this, leave as a safeguard
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4

#      - name: Set up JDK 17
#        uses: actions/setup-java@v4
#        with:
#          java-version: '17'
#          distribution: 'temurin'
#          cache: maven # lazy about this (cache ~/.cargo instead??)

      - name: Run tests
        run: mise exec --  ./gradlew publishLocal test

      - name: Package with Maven
        run: mise exec --  ./gradlew assemble
